<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">David — software engineer</title>
  <desc id="desc">A neon-inspired profile header for David, backend developer and product engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11152b"/>
      <stop offset="0.55" stop-color="#1d1640"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="0.52" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#59d8ff"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <circle cx="1010" cy="35" r="170" fill="#7c6cff" opacity=".12"/>
  <circle cx="1085" cy="235" r="185" fill="#ff3cac" opacity=".10"/>
  <path d="M0 226 C190 158 292 274 468 208 S770 120 1200 204" fill="none" stroke="url(#glow)" stroke-width="2" opacity=".55"/>
  <path d="M0 246 C190 178 292 294 468 228 S770 140 1200 224" fill="none" stroke="#59d8ff" stroke-width="1" opacity=".22"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="92" fill="#f7f7fb" font-size="62" font-weight="800" letter-spacing="7">DAVID</text>
    <rect x="76" y="114" width="116" height="5" rx="2.5" fill="url(#glow)" filter="url(#softGlow)"/>
    <text x="76" y="157" fill="#c9c7df" font-size="22" letter-spacing="4">BACKEND · PRODUCT · AI</text>
    <text x="76" y="201" fill="#ffffff" font-size="19">making the messy stuff feel simple</text>

    <g transform="translate(790 72)">
      <rect width="292" height="126" rx="18" fill="#0b1020" opacity=".78" stroke="#4d467d"/>
      <text x="24" y="34" fill="#8f88b7" font-size="14" letter-spacing="2">CURRENT BUILD</text>
      <text x="24" y="67" fill="#f7f7fb" font-size="24" font-weight="700">real problems</text>
      <text x="24" y="97" fill="#59d8ff" font-size="24" font-weight="700">useful software</text>
      <circle cx="256" cy="30" r="8" fill="#a6f36b"/>
    </g>
  </g>
</svg>
