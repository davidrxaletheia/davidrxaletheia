<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">David's binary neofetch</title>
  <desc id="desc">A Catppuccin terminal card with a sphere made of binary digits and David's technical profile.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <radialGradient id="sphere" cx="42%" cy="38%" r="68%">
      <stop offset="0" stop-color="#313244"/>
      <stop offset=".72" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </radialGradient>
    <radialGradient id="core" cx="45%" cy="42%" r="65%">
      <stop offset="0" stop-color="#89dceb" stop-opacity=".75"/>
      <stop offset=".3" stop-color="#74c7ec" stop-opacity=".28"/>
      <stop offset="1" stop-color="#74c7ec" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#11111b" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <path id="ring1" d="M 238 181 a 34 34 0 1 1 0 68 a 34 34 0 1 1 0 -68"/>
    <path id="ring2" d="M 238 155 a 60 60 0 1 1 0 120 a 60 60 0 1 1 0 -120"/>
    <path id="ring3" d="M 238 129 a 86 86 0 1 1 0 172 a 86 86 0 1 1 0 -172"/>
    <path id="ring4" d="M 238 103 a 112 112 0 1 1 0 224 a 112 112 0 1 1 0 -224"/>
    <path id="ring5" d="M 238 81 a 134 134 0 1 1 0 268 a 134 134 0 1 1 0 -268"/>
  </defs>

  <rect x="18" y="18" width="1164" height="394" rx="18" fill="url(#panel)" stroke="#45475a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="18" y="18" width="1164" height="54" rx="18" fill="#313244"/>
  <path d="M18 54h1164v18H18z" fill="#313244"/>
  <circle cx="52" cy="45" r="9" fill="#f38ba8"/>
  <circle cx="82" cy="45" r="9" fill="#f9e2af"/>
  <circle cx="112" cy="45" r="9" fill="#a6e3a1"/>
  <text x="600" y="50" text-anchor="middle" fill="#bac2de" font-family="Courier New,Courier,Consolas,monospace" font-size="16">david@aletheia: ~ — neofetch</text>

  <circle cx="238" cy="215" r="148" fill="url(#sphere)" stroke="#45475a" stroke-width="2"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="238" cy="215" r="34" stroke="#f5c2e7" stroke-width="1" opacity=".38"/>
    <circle cx="238" cy="215" r="60" stroke="#cba6f7" stroke-width="1" opacity=".42"/>
    <circle cx="238" cy="215" r="86" stroke="#89dceb" stroke-width="1" opacity=".46"/>
    <circle cx="238" cy="215" r="112" stroke="#cba6f7" stroke-width="1" opacity=".36"/>
    <circle cx="238" cy="215" r="134" stroke="#89dceb" stroke-width="1" opacity=".3"/>
  </g>
  <g font-family="Courier New,Courier,Consolas,monospace" font-size="15" letter-spacing="4">
    <text fill="#f5c2e7" opacity=".95"><textPath xlink:href="#ring1" startOffset="2%">01 10 01 10 01 10 01 10 01 10</textPath></text>
    <text fill="#cba6f7" opacity=".92"><textPath xlink:href="#ring2" startOffset="1%">001 101 001 101 001 101 001 101 001 101</textPath></text>
    <text fill="#89dceb" opacity=".9"><textPath xlink:href="#ring3" startOffset="1%">0101 1100 0101 1100 0101 1100 0101 1100</textPath></text>
    <text fill="#cba6f7" opacity=".82"><textPath xlink:href="#ring4" startOffset="1%">1010 0110 1010 0110 1010 0110 1010 0110</textPath></text>
    <text fill="#89dceb" opacity=".76"><textPath xlink:href="#ring5" startOffset="1%">0011 0101 0011 0101 0011 0101 0011 0101 0011</textPath></text>
  </g>
  <circle cx="238" cy="215" r="104" fill="url(#core)" opacity=".34" filter="url(#glow)"/>
  <circle cx="238" cy="215" r="18" fill="#89dceb" opacity=".25" filter="url(#glow)"/>
  <circle cx="238" cy="215" r="13" fill="#89dceb" opacity=".72"/>
  <circle cx="234" cy="211" r="5" fill="#cdd6f4" opacity=".78"/>

  <g font-family="Courier New,Courier,Consolas,monospace">
    <text x="478" y="112" fill="#a6e3a1" font-size="20">david@aletheia</text><text x="650" y="112" fill="#cdd6f4" font-size="20">:~$ neofetch</text>
    <text x="478" y="151" fill="#f5c2e7" font-size="19">David Uriel Ramirez Xochipa</text>
    <text x="478" y="183" fill="#bac2de" font-size="16">────────────────────────────────────────</text>

    <text x="478" y="218" fill="#89dceb" font-size="17">OS</text><text x="610" y="218" fill="#cdd6f4" font-size="17">Aletheia / México</text>
    <text x="478" y="247" fill="#89dceb" font-size="17">ROLE</text><text x="610" y="247" fill="#cdd6f4" font-size="17">backend · producto · IA</text>
    <text x="478" y="276" fill="#89dceb" font-size="17">STACK</text><text x="610" y="276" fill="#cdd6f4" font-size="17">Go · Python · TypeScript</text>
    <text x="478" y="305" fill="#89dceb" font-size="17">DATA</text><text x="610" y="305" fill="#cdd6f4" font-size="17">SQL · NoSQL · PostgreSQL</text>
    <text x="478" y="334" fill="#89dceb" font-size="17">INFRA</text><text x="610" y="334" fill="#cdd6f4" font-size="17">Docker · OpenAPI · Actions</text>
    <text x="478" y="375" fill="#f9e2af" font-size="17">STATUS</text><text x="610" y="375" fill="#a6e3a1" font-size="17">building useful things ●</text>
  </g>
</svg>
