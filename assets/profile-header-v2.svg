<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">David's Catppuccin terminal</title>
  <desc id="desc">A retro Catppuccin Mocha terminal showing David's profile, projects and technology focus.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#11111b" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="1164" height="394" rx="18" fill="url(#screen)" stroke="#45475a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="18" y="18" width="1164" height="54" rx="18" fill="#313244"/>
  <path d="M18 54h1164v18H18z" fill="#313244"/>
  <circle cx="52" cy="45" r="9" fill="#f38ba8"/>
  <circle cx="82" cy="45" r="9" fill="#f9e2af"/>
  <circle cx="112" cy="45" r="9" fill="#a6e3a1"/>
  <text x="600" y="50" text-anchor="middle" fill="#bac2de" font-family="Courier New,Courier,Consolas,monospace" font-size="16">david@aletheia: ~ — bash</text>

  <g font-family="Courier New,Courier,Consolas,monospace" font-size="20">
    <text x="58" y="112" fill="#a6e3a1">david@aletheia</text><text x="230" y="112" fill="#cdd6f4">:</text><text x="244" y="112" fill="#89dceb">~</text><text x="260" y="112" fill="#cdd6f4">$ whoami</text>
    <text x="58" y="144" fill="#f5c2e7">David Uriel Ramirez Xochipa</text>

    <text x="58" y="188" fill="#a6e3a1">david@aletheia</text><text x="230" y="188" fill="#cdd6f4">:</text><text x="244" y="188" fill="#89dceb">~</text><text x="260" y="188" fill="#cdd6f4">$ cat role.txt</text>
    <text x="58" y="220" fill="#cba6f7">backend developer · product engineer · builder of useful software</text>

    <text x="58" y="264" fill="#a6e3a1">david@aletheia</text><text x="230" y="264" fill="#cdd6f4">:</text><text x="244" y="264" fill="#89dceb">~</text><text x="260" y="264" fill="#cdd6f4">$ ls ~/projects</text>
    <text x="58" y="296" fill="#89dceb">cinpro</text><text x="145" y="296" fill="#bac2de">cuenco</text><text x="235" y="296" fill="#f9e2af">facturero</text><text x="355" y="296" fill="#f5c2e7">imamedica</text><text x="482" y="296" fill="#a6e3a1">berry-verde</text>

    <text x="58" y="340" fill="#a6e3a1">david@aletheia</text><text x="230" y="340" fill="#cdd6f4">:</text><text x="244" y="340" fill="#89dceb">~</text><text x="260" y="340" fill="#cdd6f4">$ echo $MOTTO</text>
    <text x="58" y="372" fill="#f9e2af">"hacer que el caos tenga botones"</text>
    <rect x="478" y="357" width="12" height="22" rx="2" fill="#cba6f7" opacity=".9"/>

    <g transform="translate(836 120)">
      <rect width="292" height="210" rx="14" fill="#11111b" stroke="#45475a"/>
      <text x="24" y="38" fill="#cba6f7" font-size="15">ALETHEIA.MX</text>
      <text x="24" y="76" fill="#f5c2e7" font-size="15">si lees esto</text>
      <text x="24" y="98" fill="#f5c2e7" font-size="15">es porque sabes leer</text>
      <text x="24" y="132" fill="#bac2de" font-size="15">focus  <tspan fill="#89dceb">APIs + data + AI</tspan></text>
      <text x="24" y="160" fill="#bac2de" font-size="15">status <tspan fill="#f9e2af">building...</tspan></text>
      <text x="24" y="192" fill="#f5c2e7" font-size="15">coffee_required=true</text>
    </g>
  </g>
</svg>
